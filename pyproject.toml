[project]
name = "tts"
version = "0.0.1"
description = "Low-requirement expressive English TTS (Dual-AR + Mimi codec)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "numpy",
    "safetensors",
    "soundfile",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45",
]

[project.optional-dependencies]
ui = ["gradio>=6", "pandas"]
dev = ["pytest", "tts[ui]"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
