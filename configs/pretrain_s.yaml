# Stage P1 pretraining, S model (Qwen3-0.6B slow AR + ~98M fast AR), 1x GB10.
# See docs/ARCHITECTURE.md §6.3 for the compute estimate behind these numbers.
run_dir: runs/pretrain_s
data:
  - data/shards/mls_en
  - data/shards/emilia_yodas_en
base: Qwen/Qwen3-0.6B
codec: kyutai/mimi
num_codebooks: 8

lr: 2.0e-4
min_lr_ratio: 0.1
warmup_steps: 2000
max_steps: 200000
weight_decay: 0.1
grad_clip: 1.0
# ~65k tokens per optimizer step. Raise max_tokens_per_batch (and lower
# grad_accum) if memory allows; 128 GB unified memory leaves a lot of room.
max_tokens_per_batch: 16384
grad_accum: 4
precision: bf16
gradient_checkpointing: true

ref_prob: 0.5
max_ref_frames: 250
val_fraction: 0.005
max_val_utterances: 500
num_workers: 4

log_every: 10
eval_every: 2000
save_every: 2000
keep_checkpoints: 3
num_eval_samples: 4
eval_max_frames: 500
device: cuda
